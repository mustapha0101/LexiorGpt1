generation:
  seed: 3407
  language: fr
  target_accepted: 100
  max_tool_calls: 4
  # Budgets spécifiques au chat live. Le budget dataset reste séparé.
  max_tool_calls_live: 6
  max_clarifications_live: 2
  max_search_reformulations_live: 1
  max_planner_decisions_live: 12
  # Sous ce seuil, le système demande ce que l'utilisateur souhaite au lieu
  # de déclencher une recherche juridique sur une classification incertaine.
  classification_min_confidence: 0.65
  # Les articles issus de la recherche sont lus en lots : on commence assez
  # large pour vérifier plusieurs hypothèses, puis on élargit seulement si la
  # revue ne trouve aucune règle utilisable. Aucun numéro d'article n'est
  # encodé dans cette politique.
  # Legacy values are retained for non-evidence-first compatibility only.
  # The active evidence-first policy below owns live retrieval budgets.
  initial_article_fetch_k: 3
  article_fetch_batch_size: 3
  max_articles_per_issue: 6
  # Une récupération groupée contient au plus 20 articles; le contexte doit
  # pouvoir conserver intégralement leurs textes officiels pour les vérifier.
  max_tool_response_chars: 14000
  near_duplicate_jaccard: 0.90
  prompt_version: agentic-4.1-semantic-routing
  max_search_reformulations: 1
  max_thinking_words: 45
  failure_injection_rate: 0.07

evidence_first:
  enabled: true
  initial_candidate_count: 5
  initial_fetch_count: 3
  maximum_primary_sources: 3
  maximum_secondary_sources: 3
  maximum_article_batches: 2
  maximum_clarifications: 2
  maximum_targeted_retrieval_repairs: 1
  jurisprudence_requires_justification: true
  follow_normative_references: true

  request_type_weights:
    case_analysis: 0.25
    procedure_guidance: 0.18
    topic_research: 0.12
    exact_text_retrieval: 0.07
    article_explanation: 0.06
    case_law_research: 0.10
    law_or_regulation_identification: 0.07
    legislative_status_verification: 0.05
    document_analysis: 0.04
    comparative_law: 0.02
    dataset_coverage: 0.01
    non_legal: 0.03

  jurisdiction_weights:
    supported_quebec: 0.58
    supported_federal: 0.22
    municipal_coverage_uncertain: 0.07
    supported_other_canadian: 0.08
    unsupported_foreign: 0.05

  clarification_stage_weights:
    none: 0.55
    before_search: 0.20
    after_initial_research: 0.25

  failure_mode_weights:
    irrelevant_results: 0.25
    wrong_document_type: 0.20
    empty_result: 0.15
    truncated_source: 0.15
    tool_error: 0.10
    stale_source: 0.08
    malformed_result: 0.04
    coverage_gap: 0.03

teacher:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  timeout: 120
  max_retries: 3
  concurrency: 4
  temperature: 0.3

critic:
  base_url: ""
  # Les contrôles de pertinence, de causalité et de grounding déterminent ce
  # qui peut être livré : ils utilisent un modèle de revue distinct du modèle
  # de rédaction plus économique.
  model: "gpt-4o"
  temperature: 0.0

# Index local des articles CCQ/CPC. Les embeddings sont calculés une fois,
# puis chaque recherche utilise la question complète et un reranking hybride.
rag:
  enabled: true
  index_dir: data/agentic/rag_index
  dataset_name: intelliwork/canadian-quebec-law-corpus
  dataset_split: train
  embedding_base_url: https://api.openai.com/v1
  embedding_model: text-embedding-3-small
  embedding_batch_size: 128
  embedding_price_per_1m_usd: 0.02
  # La recherche et la récupération sont bornées à la même largeur : le
  # filtre d'applicabilité peut donc comparer toutes les pistes avant d'en
  # écarter une, y compris les règles générales moins lexicalement proches.
  top_k: 20
  candidate_k: 40
  dense_weight: 0.60
  llm_rerank_enabled: true
  # Le relecteur juridique examine une liste large, puis réordonne une
  # sélection bornée; cela préserve les règles générales derrière les faits.
  llm_rerank_k: 40
  # Filet de rappel sans verrou de rang : un candidat initialement 17e peut
  # devenir premier après comparaison de sa règle et des faits.
  rerank_recall_reserve_k: 2
  # Planchers de pertinence sur l'echelle absolue (0.0 = desactive).
  # Calibres le 2026-07-25 sur tests/fixtures/retrieval_gold.jsonl.
  # min_dense_score 0.40 : ameliore le classement (MRR 0.340 -> 0.397,
  # recall@8 0.487 -> 0.525) en ecartant les candidats sans rapport.
  # min_hybrid_score reste desactive : toute valeur positive detruit le
  # rappel (0.55 -> 7 questions repondables vidées) sans faire baisser les
  # faux positifs en dessous de 0.50. Voir retrieval_gold_baseline.json.
  min_dense_score: 0.40
  min_hybrid_score: 0.0
  # Le plancher a ete calibre sur des requetes en style juridique (0,58-0,70)
  # et rejetait le langage naturel : 0,305 pour « mon fils a casse la vitrine
  # du depanneur », alors que le bon article y est au rang 8 du canal dense.
  # Les N premiers candidats du canal dense echappent au plancher.
  # Mesure sur retrieval_gold.jsonl, 40 questions repondables :
  #   exemption   hit@3   hit@10    MRR   candidats retenus
  #   aucune      0.500   0.600   0.405        2254
  #   top-10      0.500   0.625   0.408        2297   <- retenu
  #   top-40      0.475   0.600   0.389        2640
  # top-40 degrade : exempter largement laisse entrer des candidats mediocres
  # qui faussent la normalisation min-max. 0 desactive l'exemption.
  dense_floor_exempt_top_k: 10

critics:
  legal_min_score: 0.70
  agentic_min_score: 0.70
  max_repairs: 1

paths:
  data_root: data/agentic
  catalog: ../docs/mcp_tools_catalog.json
  mcp_config: ../.mcp.json
  # La démo affiche déjà les événements dans l'interface; aucun journal de
  # conversation n'est écrit sur disque.
  chat_sessions: ""
